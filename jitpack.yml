jdk:
  - openjdk17

before_install:
  - echo "Java version:"
  - java -version
  - echo "Gradle version:"
  - ./gradlew --version

# JitPack automatically detects and publishes modules with maven-publish plugin
# We need to build the project first, then JitPack will publish :core automatically
# Build all dependencies first, then build :core (which will trigger KSP for all variants)
install:
  - ./gradlew build -x test -x ktlintCheck -x detekt -x checkstyleDebug -x pmdDebug --no-daemon

