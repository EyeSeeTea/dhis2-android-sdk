jdk:
  - openjdk17

before_install:
  - echo "Java version:"
  - java -version
  - echo "Gradle version:"
  - ./gradlew --version

# JitPack automatically detects and publishes modules with maven-publish plugin
# Use 'assemble' instead of 'build' to skip all verification tasks (ktlint, detekt, etc.)
# Build dependencies first, then assemble release and publish to Maven Local
# JitPack will find the published artifacts in ~/.m2
install:
  # Clean to avoid cache issues
  - ./gradlew clean --no-daemon || true
  # Build dependencies first with increased memory
  - export GRADLE_OPTS="-Xmx2048m -XX:MaxMetaspaceSize=512m"
  - ./gradlew :annotations:assemble :processor:assemble --no-daemon --stacktrace
  # Build and publish core module
  - ./gradlew :core:assembleRelease :core:publishToMavenLocal --no-daemon --stacktrace

